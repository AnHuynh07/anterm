services:
  anterm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: anterm:local
    ports:
      - "3000:3000"
    environment:
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      ANTERM_APP_SECRET: ${ANTERM_APP_SECRET:?set ANTERM_APP_SECRET in a .env file}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in a .env file}
      # Optional: enable WeTTY-style ad-hoc SSH
      # ANTERM_SSH_HOST: 10.0.0.5
      # ANTERM_SSH_USER: ubuntu
      # Optional: restrict SSH targets
      # ANTERM_ALLOW_HOSTS: 10.0.0.5,db.internal
    volumes:
      - anterm-data:/data
    restart: unless-stopped

volumes:
  anterm-data:
